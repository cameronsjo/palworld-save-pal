name: Build and push image

# Manual, one-shot builder — this fork has no ongoing release pipeline.
# Local builds hit a QEMU/Bun segfault when cross-building linux/amd64 on
# Apple Silicon, so this runs the build on a native amd64 GitHub runner
# instead. Trigger by hand with `gh workflow run build-image.yml`.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cameronsjo/palworld-editor:${{ github.sha }}
            ghcr.io/cameronsjo/palworld-editor:latest
